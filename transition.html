<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition</title>

<style>
body {
  margin: 0;
  background-color: #102018;
}

.page {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
}

.bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.click-shop,
.click-sanctuary {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 360px;
  height: 85px;
  border-radius: 999px;
  cursor: pointer;
}

.click-shop {
  top: 58%;
}

.click-sanctuary {
  top: 72%;
}

@media (max-width: 700px) {
  .click-shop,
  .click-sanctuary {
    width: 300px;
    height: 70px;
  }

  .click-shop {
    top: 56%;
  }

  .click-sanctuary {
    top: 68%;
  }
}
</style>
</head>

<body>

<div class="page">

  <img src="transitionnew.png" class="bg" alt="Choose your path">

  <a href="shop.html" class="click-shop" aria-label="Nature Nurture Wellbeing Shop"></a>

  <a href="sanctuary.html" class="click-sanctuary" aria-label="Enter Sanctuary Falls"></a>

</div>

</body>
</html>
