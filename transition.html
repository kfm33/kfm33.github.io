<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Transition</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;

  /* YOUR IMAGE HERE */
  background: url("transition.png") no-repeat center center;
  background-size: cover;
  background-color: #102018;
}

.overlay {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10,25,20,0.25);
}

/* optional soft fade */
.fade {
  opacity: 0;
  animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="overlay">
  <div class="fade"></div>
</div>

<script>
setTimeout(function() {
  window.location.href = "natureshop.html";
}, 2500);
</script>

</body>
</html>
