<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Transition</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;

  /* YOUR IMAGE HERE */
  background: url("transition.png") no-repeat center center;
  background-size: cover;
  background-color: #102018;
}

.overlay {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10,25,20,0.25);
}

/* optional soft fade */
.fade {
  opacity: 0;
  animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>
</head>

<body>

<div class="overlay">
  <div class="fade"></div>
</div>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transition</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  color: white;
  background: url("transition.png") no-repeat center center fixed;
  background-size: cover;
}

.overlay {
  min-height: 100vh;
  position: relative;
  background: rgba(10,25,20,0.18);
}

.continue-btn {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  padding: 14px 32px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  backdrop-filter: blur(4px);
  box-shadow: 0 0 18px rgba(255,255,255,0.18);
}

.continue-btn:hover {
  background: white;
  color: black;
}
</style>
</head>

<body>
  <div class="overlay">
    <button class="continue-btn" onclick="location.href='natureshop.html'">
      Continue gently
    </button>
  </div>
</body>
</html>
</body>
</html>
