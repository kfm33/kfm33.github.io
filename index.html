<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Nurture Wellbeing</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background-color: #102018;
  color: white;
}

.overlay {
  position: relative;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.hero-image {
  width: 100%;
  max-width: 1100px;
  height: auto;
  display: block;
}

.top-text {
  position: absolute;
  top: 55px;
  width: 100%;
  text-align: center;
  font-size: 1.2rem;
  text-shadow: 0 2px 12px rgba(0,0,0,0.6);
}

.bottom-button {
  position: absolute;
  bottom: 35px;
  width: 100%;
  text-align: center;
}

.enter-btn {
  padding: 14px 30px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  backdrop-filter: blur(4px);
  box-shadow: 0 0 18px rgba(255,255,255,0.18);
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* MOBILE */
@media (max-width: 700px) {
  .overlay {
    align-items: center;
  }

  .hero-image {
    width: 95%;
    max-width: none;
  }

  .top-text {
    top: 28px;
    font-size: 1rem;
  }

  .bottom-button {
    bottom: 25px;
  }

  .enter-btn {
    font-size: 1rem;
    padding: 12px 26px;
  }
}
</style>
</head>

<body>

<div class="overlay">

  <img src="nature-hare.png" class="hero-image" alt="Nature Nurture Wellbeing">

  <div class="top-text">
    Breathe... you are here
  </div>

  <div class="bottom-button">
    <button class="enter-btn" onclick="location.href='transition.html'">
      Enter gently
    </button>
  </div>

</div>

</body>
</html>
