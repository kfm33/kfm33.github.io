<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature Nurture Wellbeing</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: url("nature-hare.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
@media (max-width: 700px) {
  body {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center top;
    background-color: #102018;
  }

  .top-text {
    top: 25px;
    font-size: 1rem;
  }

  .bottom-button {
    bottom: 25px;
  }

  .enter-btn {
    font-size: 1rem;
    padding: 12px 26px;
  }
}
    .overlay {
      position: relative;
      min-height: 100vh;
    }

    .top-text {
      position: absolute;
      top: 60px;
      width: 100%;
      text-align: center;
      font-size: 1.2rem;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }

    .bottom-button {
      position: absolute;
      bottom: 25px;
      width: 100%;
      text-align: center;
    }

    .enter-btn {
      padding: 14px 30px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 18px rgba(255,255,255,0.18);
    }

    .enter-btn:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="overlay">

    <div class="top-text">
      Breathe… you are here
    </div>

    <div class="bottom-button">
      <button class="enter-btn" onclick="location.href='transition.html'">
        Enter gently
      </button>
    </div>

  </div>

</body>
</html>
