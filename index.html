<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nature Nurture Wellbeing</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      color: white;
      background: url("nature-hare.png") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      position: relative;
      background: rgba(10, 25, 20, 0.10);
      min-height: 100vh;
      box-sizing: border-box;
    }

    .top-text {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.25rem;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(0,0,0,0.65);
    }

    .bottom-button {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
    }

    .enter-btn {
      padding: 14px 32px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 18px rgba(255,255,255,0.18);
      transition: all 0.25s ease;
    }

    .enter-btn:hover {
      background: white;
      color: black;
      box-shadow: 0 0 28px rgba(255,255,255,0.35);
      transform: translateY(-2px);
    }

    @media (max-width: 700px) {
      .top-text {
        top: 35px;
        font-size: 1.05rem;
      }

      .bottom-button {
        bottom: 45px;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">

    <div class="top-text">
      Breathe… you are here
    </div>

    <div class="bottom-button">
      <button class="enter-btn" onclick="location.href='natureshop.html'">
        Enter gently
      </button>
    </div>

  </div>
</body>
</html>
