<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Nurture Wellbeing</title>

<style>
body {
  margin: 0;
  font-family: Georgia, serif;
  background-color: #102018;
  color: white;
}

.container {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  align-items: center;
  text-align: center;
  padding: 30px 20px;
  box-sizing: border-box;
}

.top-text {
  font-size: 1.4rem;
}

.hero-image {
  width: 90%;
  max-width: 850px;
  height: auto;
  display: block;
}

.enter-btn {
  padding: 14px 34px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 0 22px rgba(255,255,255,0.25);
}

.enter-btn:hover {
  background: white;
  color: black;
}

/* MOBILE ONLY */
@media (max-width: 700px) {
  .container {
    justify-content: space-evenly;
    padding: 25px 10px;
  }

  .top-text {
    font-size: 1.2rem;
  }

  .hero-image {
    content: url("nature-hare.png");
    width: 95%;
    max-width: 430px;
  }

  .enter-btn {
    font-size: 1rem;
    padding: 12px 28px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-text">
    Breathe… you are here
  </div>

  <img src="nature-hare.png" class="hero-image" alt="Nature Nurture Wellbeing logo">

  <button class="enter-btn" onclick="location.href='transition.html'">
    Enter gently
  </button>

</div>

</body>
</html>
